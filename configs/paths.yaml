      ablation_checkpoint_dir: reference_artifacts/checkpoints/ablation
      baseline_checkpoint_dir: reference_artifacts/checkpoints/baselines
      explainer_checkpoint_dir: reference_artifacts/checkpoints/explainers
      metrics_dir: reference_artifacts/metrics
